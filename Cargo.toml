[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tyuan511/fastgrid"
rust-version = "1.85"

[workspace.dependencies]
# internal
fg-core = { path = "crates/fg-core" }
fg-driver = { path = "crates/fg-driver" }
fg-store = { path = "crates/fg-store" }
fg-sql = { path = "crates/fg-sql" }
fg-service = { path = "crates/fg-service" }
fg-mcp = { path = "crates/fg-mcp" }

# external (versions pinned as each crate starts using them)
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
rusqlite = { version = "0.40", features = ["bundled", "column_decltype", "column_metadata"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
