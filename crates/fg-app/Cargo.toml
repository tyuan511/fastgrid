[package]
name = "fg-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "fg_app"
path = "src/lib.rs"

[[bin]]
name = "fastgrid"
path = "src/main.rs"

[dependencies]
fg-core.workspace = true
fg-driver.workspace = true
fg-service.workspace = true
fg-lsp.workspace = true
fg-mcp.workspace = true
fg-sql.workspace = true
lsp-types.workspace = true
anyhow.workspace = true
fg-store.workspace = true
dirs.workspace = true
gpui-kit = {
    version = "0.8",
    features = ["gpui-fast", "tree-sitter", "tree-sitter-sql"],
}
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
futures.workspace = true
gpui-kit = {
    version = "0.8",
    features = ["gpui-fast", "tree-sitter", "tree-sitter-sql", "test-support"],
}
